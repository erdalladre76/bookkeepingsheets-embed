<script>(window.BSKQ=window.BSKQ||[]).push({id:'bs-pc',key:'pc',title:'Percentage Calculator',
inputs:[{id:'mode',label:'Calculation',type:'select',def:'of',wide:true,opts:[['of','What is X% of Y?'],['is','X is what percent of Y?'],['chg','Percent change from X to Y'],['inc','Increase Y by X%'],['dec','Decrease Y by X%']]},{id:'x',label:'X',ph:'15',step:'any'},{id:'y',label:'Y',ph:'240',step:'any'}],
demo:{mode:'of',x:'15',y:'240'},
calc:function(v,F){var x=v.x,y=v.y;if(!isFinite(x)||!isFinite(y))return {hint:'Enter X and Y.'};function n(z){return (Math.round(z*10000)/10000).toLocaleString('en-US',{maximumFractionDigits:4})}
 var res,lab,f;if(v.mode==='of'){res=x/100*y;lab=n(x)+'% of '+n(y);f=n(x)+' / 100 x '+n(y)+' = '+n(res);res=n(res)}
 else if(v.mode==='is'){if(!y)return {error:'Y cannot be zero.'};res=x/y*100;lab=n(x)+' is this % of '+n(y);f=n(x)+' / '+n(y)+' x 100 = '+n(res)+'%';res=n(res)+'%'}
 else if(v.mode==='chg'){if(!x)return {error:'X cannot be zero for percent change.'};res=(y-x)/Math.abs(x)*100;lab='Change from '+n(x)+' to '+n(y);f='('+n(y)+' - '+n(x)+') / '+n(Math.abs(x))+' x 100 = '+n(res)+'%';res=(res>0?'+':'')+n(res)+'%'}
 else if(v.mode==='inc'){res=y*(1+x/100);lab=n(y)+' increased by '+n(x)+'%';f=n(y)+' x (1 + '+n(x)+'/100) = '+n(res);res=n(res)}
 else {res=y*(1-x/100);lab=n(y)+' decreased by '+n(x)+'%';f=n(y)+' x (1 - '+n(x)+'/100) = '+n(res);res=n(res)}
 return {kpis:[[lab,res,'g']],tables:[{title:'How it was calculated',head:['Formula'],rows:[[f]]}]}}});
</script>
