<script>(window.BSKQ=window.BSKQ||[]).push({id:'bs-fm',key:'fm',title:'Custom Farming Rate Calculator',

 var S=P*(v.sv||0)/100,dep=(P-S)/y,int=(P+S)/2*(v.ir||0)/100,tih=P*(v.tih||0)/100,fixY=dep+int+tih,fixH=fixY/h;
 var rep=P*(v.rm||0)/100/h,fuel=(v.gal||0)*(v.dsl||0),lube=fuel*0.15,lab=(v.lab||0)*1.1,opH=rep+fuel+lube+lab,totH=fixH+opH,perA=totH/a,mg=(v.mg||0)/100,rateA=perA*(1+mg),rateH=totH*(1+mg);
 function at(hh){var f=fixY/hh,o=P*(v.rm||0)/100/hh+fuel+lube+lab;return (f+o)/a*(1+mg)}
 var rows=[['Depreciation',F.money(dep,0),F.money(dep/h),F.money(dep/h/a)],['Interest on investment',F.money(int,0),F.money(int/h),F.money(int/h/a)],['Taxes, insurance, housing',F.money(tih,0),F.money(tih/h),F.money(tih/h/a)],['Repairs & maintenance','',F.money(rep),F.money(rep/a)],['Fuel','',F.money(fuel),F.money(fuel/a)],['Lubrication (15% of fuel)','',F.money(lube),F.money(lube/a)],['Labor (wage + 10% extra time)','',F.money(lab),F.money(lab/a)],['Total cost','',F.money(totH),F.money(perA)],['Rate to charge (+'+F.pct(v.mg||0,0)+' margin)','',F.money(rateH),F.money(rateA)]];
 var use=[150,300,500,800].map(function(x){return [F.int(x)+' hours / year ('+F.int(x*a)+' acres)',F.money(at(x))+' per acre']});

 note:'Fixed costs (depreciation, interest, taxes, insurance, housing) are spread over the hours you use the machine each year, so more custom work lowers your cost per acre. Compare your result with your state extension service custom rate survey (for example Iowa State, MSU, Ohio State or Nebraska) before quoting. Estimate for planning, not financial advice.'}}});
