<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:M;font-weight:600;src:url(../node_modules/@fontsource/manrope/files/manrope-latin-600-normal.woff2)}
@font-face{font-family:M;font-weight:800;src:url(../node_modules/@fontsource/manrope/files/manrope-latin-800-normal.woff2)}
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;font-family:M;background:#0b1d3a;color:#fff;position:relative}
#top{position:absolute;left:0;right:0;top:0;height:300px;background:#0b1d3a;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:26px;border-bottom:2px solid rgba(255,255,255,.08)}
#title{font-weight:800;font-size:64px;text-align:center;line-height:1.05;padding:0 60px}
#title em{font-style:normal;color:#f5b731}
#who{margin-top:14px;font-weight:600;font-size:30px;color:#9fb2d4}
#chat{position:absolute;left:0;right:0;top:300px;bottom:180px;background:#ece5dd;overflow:hidden}
#msgs{position:absolute;left:0;right:0;bottom:24px;display:flex;flex-direction:column;gap:18px;padding:0 40px}
.m{max-width:800px;font-weight:600;font-size:46px;line-height:1.25;padding:22px 30px;border-radius:30px;color:#111;box-shadow:0 2px 2px rgba(0,0,0,.12)}
.l{align-self:flex-start;background:#fff;border-top-left-radius:6px}
.r{align-self:flex-end;background:#d9fdd3;border-top-right-radius:6px}
.r.calc{background:#fff7dc;font-weight:800}
.r.big{background:#f5b731;font-weight:800;font-size:58px}
.typing{align-self:flex-start;background:#fff;border-radius:30px;padding:26px 34px;display:flex;gap:12px}
.typing.r{align-self:flex-end;background:#d9fdd3}
.typing i{width:18px;height:18px;border-radius:50%;background:#999;display:block}
#bot{position:absolute;left:0;right:0;bottom:0;height:180px;background:#0b1d3a;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:44px}
#bot span{color:#3ccf86}
#card{position:absolute;inset:0;z-index:5;display:none;background:#0b1d3a}
#card .ph{position:absolute;inset:0;background-size:cover;background-position:center}
#card .g{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,29,58,.2) 0%,rgba(11,29,58,.35) 45%,rgba(11,29,58,.95) 75%)}
#card .t{position:absolute;left:70px;right:70px;bottom:260px;text-align:center}
#card .a{font-weight:800;font-size:96px;line-height:1.02}
#card .a em{font-style:normal;color:#f5b731}
#card .b{font-weight:800;font-size:46px;margin-top:30px;color:#dbe4f3}
#card .u{display:inline-block;margin-top:40px;background:#fff;color:#0b1d3a;font-weight:800;font-size:50px;padding:16px 36px;border-radius:18px}
#card .u span{color:#2fae6b}
</style></head><body>
<div id="top"><div id="title"></div><div id="who"></div></div>
<div id="chat"><div id="msgs"></div></div>
<div id="bot">bookkeeping<span>sheets</span>.com</div>
<div id="card"><div class="ph"></div><div class="g"></div><div class="t"><div class="a"></div><div class="b"></div><div class="u">bookkeeping<span>sheets</span>.com</div></div></div>
<script>
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function state(S){
  document.getElementById('title').innerHTML=S.title;
  document.getElementById('who').textContent=S.who||'';
  const c=document.getElementById('card');
  if(S.card){c.style.display='block';c.querySelector('.ph').style.backgroundImage=`url(${S.card.img})`;c.querySelector('.a').innerHTML=S.card.a;c.querySelector('.b').textContent=S.card.b;c.querySelector('.u').style.display=S.card.url?'inline-block':'none';return;}
  c.style.display='none';
  document.getElementById('msgs').innerHTML=S.msgs.map(m=>`<div class="m ${m.s} ${m.c||''}">${esc(m.t)}</div>`).join('')+(S.typing?`<div class="typing ${S.typing}"><i></i><i></i><i></i></div>`:'');
}
</script></body></html>
