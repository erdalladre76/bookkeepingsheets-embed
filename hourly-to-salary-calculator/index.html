<script>(window.BSKQ=window.BSKQ||[]).push({id:'bs-sa',key:'sa',title:'Hourly to Salary Calculator',
inputs:[{id:'mode',label:'I know my',type:'select',def:'h',wide:true,opts:[['h','Hourly wage'],['y','Annual salary']]},{id:'amt',label:'Amount ($)',ph:'28',step:0.01},{id:'hpw',label:'Hours per week',def:'40',step:0.5},{id:'wpy',label:'Paid weeks per year',def:'52',step:1},{id:'ot',label:'Overtime hours per week (1.5x)',def:'0',step:0.5}],
demo:{mode:'h',amt:'28',hpw:'40',wpy:'52',ot:'0'},
calc:function(v,F){var a=v.amt,h=v.hpw,w=v.wpy,o=v.ot||0;if(!(a>0)||!(h>0)||!(w>0))return {hint:'Enter your pay, hours per week and weeks per year.'};
 var hr=v.mode==='h'?a:a/(h*w),reg=hr*h*w,ot=hr*1.5*o*w,yr=reg+ot;
 var rows=[['Hourly',F.money(hr)],['Daily (5-day week)',F.money(yr/w/5)],['Weekly',F.money(yr/w)],['Biweekly',F.money(yr/26)],['Semi-monthly',F.money(yr/24)],['Monthly',F.money(yr/12)],['Quarterly',F.money(yr/4)],['Yearly',F.money(yr)]];
 var k=[['Annual pay',F.money(yr,0),'g'],['Hourly rate',F.money(hr)],['Monthly',F.money(yr/12)],['Biweekly paycheck',F.money(yr/26)]];if(o)k.push(['Overtime per year',F.money(ot,0),'w']);
 return {kpis:k,tables:[{title:'Pay by period (before tax)',head:['Period','Gross pay'],rows:rows}],note:'Annual = hourly x hours per week x paid weeks'+(o?' + overtime at 1.5x':'')+'. Gross pay before taxes and deductions; 2,080 hours = 40 hours x 52 weeks.'}}});
</script>
