<script>(window.BSKQ=window.BSKQ||[]).push({id:'bs-st',key:'st',title:'Sales Tax Calculator',
inputs:[{id:'mode',label:'What do you have?',type:'select',def:'add',wide:true,opts:[['add','Price before tax: add sales tax'],['rev','Total including tax: back out the tax']]},{id:'amt',label:'Amount ($)',ph:'250',step:0.01},{id:'state',label:'State rate (%)',ph:'6.25',step:0.001},{id:'local',label:'Local / county / city rate (%)',ph:'2',step:0.001}],
demo:{mode:'add',amt:'250',state:'6.25',local:'2'},
calc:function(v,F){var a=v.amt,s=v.state||0,l=v.local||0,t=s+l;if(!(a>0)||!(t>=0))return {hint:'Enter an amount and your sales tax rate.'};
 var net,tax,gross;if(v.mode==='rev'){gross=a;net=a/(1+t/100);tax=gross-net}else{net=a;tax=a*t/100;gross=net+tax}
 net=Math.round(net*100)/100;tax=Math.round(tax*100)/100;gross=Math.round(gross*100)/100;
 var rows=[['Price before tax',F.money(net)],['State tax ('+F.pct(s,3)+')',F.money(net*s/100)],['Local tax ('+F.pct(l,3)+')',F.money(net*l/100)],['Total sales tax ('+F.pct(t,3)+')',F.money(tax)],['Total price',F.money(gross)]];
 return {kpis:[['Price before tax',F.money(net)],['Sales tax',F.money(tax),'w'],['Total price',F.money(gross),'g'],['Combined rate',F.pct(t,3)]],tables:[{title:'Breakdown',head:['Item','Amount'],rows:rows}],note:v.mode==='rev'?'Pre-tax price = Total / (1 + rate). Tax = Total - pre-tax price.':'Sales tax = Price x rate. Total = Price + tax.'}}});
